services:
  postgres:
    image: postgres:15-alpine
    container_name: collectigo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: collectigo
    ports:
      - '5432:5432'
    volumes:
      - collectigo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d collectigo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  collectigo_pg_data:
